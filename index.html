<style>
:root{
  --bg:#f7f4ef; --card:#fff; --line:#e8e0d6; --ink:#2e2a26; --dim:#8b8178;
  --green:#3d8a62; --blue:#3a7ca5; --red:#b0453f; --purple:#75529f;
  --teal:#2c8b86; --orange:#bd7230;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:0 0 calc(72px + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:20; background:rgba(247,244,239,.97);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:calc(7px + env(safe-area-inset-top)) 10px 6px;
}
h1{margin:0 0 6px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
h1 span{white-space:nowrap}
h1 small{flex:1 1 100%; font-size:11px; font-weight:400; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.appiconbtn{
  flex:0 0 auto; align-self:center; width:30px; height:30px; padding:0; overflow:hidden;
  border:1px solid var(--line); border-radius:8px; background:#fff;
}
.appiconbtn img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block}
.icongrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0}
.ic{
  padding:4px; border:1px solid var(--line); border-radius:9px; background:#fff;
  display:flex; flex-direction:column; align-items:center; gap:3px; font-family:inherit;
}
.ic img{width:52px; height:52px; object-fit:cover; object-position:top center; border-radius:8px; display:block}
.ic span{font-size:10px; color:var(--dim); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ic.on{border-color:#a9d3bd; background:#eaf5ef}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:2px 6px; font-size:11px; color:var(--dim); margin-bottom:6px}
.stats span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stats b{color:var(--ink); font-variant-numeric:tabular-nums}
.bar{display:flex; height:5px; border-radius:3px; overflow:hidden; background:#eae2d8; margin-bottom:7px}
.bar i{display:block; height:100%}
input[type=search]{
  width:100%; padding:8px 11px; font-size:16px; border:1px solid var(--line);
  border-radius:9px; background:#fff; color:var(--ink); margin-bottom:6px;
}
input[type=search]:focus{outline:2px solid #dcc9b4; outline-offset:-1px}
.scroll{display:flex; gap:5px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--dim);
  font-size:12.5px; padding:5px 10px; border-radius:999px; white-space:nowrap;
}
.pill.on{background:var(--ink); border-color:var(--ink); color:#fff}
.pill.seg{border-radius:9px}
.pill.seg.on{background:var(--purple); border-color:var(--purple)}
#list{margin-top:2px}
.row{display:flex; gap:8px; padding:8px 10px; background:var(--card); border-bottom:1px solid var(--line)}
.row.krow{background:#faf7fd; padding-left:16px}
.row.sub{background:#faf8f4; padding-left:16px}
.row.done{background:#fbfdfc}
.row.done.krow{background:#f7fbf8}
.row.miss{opacity:.6}
.av{
  flex:0 0 auto; width:42px; height:42px; border-radius:9px; object-fit:cover;
  object-position:top center; background:#eee4d8; display:block;
}
.av.ph{display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff; font-weight:600}
.mid{flex:1 1 auto; min-width:0}
.l1{display:flex; align-items:center; gap:6px; margin-bottom:5px; flex-wrap:wrap}
.no{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; flex:0 0 auto}
.nm{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{flex:0 0 auto; font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 4px}
.tag.cnbadge{color:#a4453f; border-color:#e2c7c4; background:#fdf6f5; font-family:inherit}
.kbox{
  margin-left:auto; flex:0 0 auto; font-size:11.5px; font-family:inherit; color:var(--dim);
  border:1px solid var(--line); background:#fff; border-radius:7px; padding:3px 8px;
}
.kbox.on{background:var(--purple); border-color:var(--purple); color:#fff; font-weight:600}
.st{
  flex:0 0 auto; font-size:11.5px; font-family:inherit; color:var(--dim);
  border:1px solid var(--line); background:#fff; border-radius:7px; padding:3px 9px;
}
.st.got.on{background:#eaf5ef; border-color:#a9d3bd; color:#2f6d4c; font-weight:600}
.st.pol.on{background:#f1ecfa; border-color:#c3b3e0; color:#5b3f85; font-weight:600}
.lbtn{margin-left:auto; display:flex; gap:6px; flex:0 0 auto}
.panel label{display:block; font-size:12.5px; color:#5c554d; margin:8px 0 3px}
.panel input[type=text],.panel input[type=number],.panel select{
  width:100%; padding:8px 10px; font-size:15px; font-family:inherit; color:var(--ink);
  border:1px solid var(--line); border-radius:9px; background:#fff;
}
.mline{display:flex; align-items:center; gap:8px; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line)}
.mline span{flex:1 1 auto}
.mline button{
  flex:0 0 auto; font-size:12.5px; font-family:inherit; color:#a4453f; background:#fdf6f5;
  border:1px solid #e2c7c4; border-radius:8px; padding:5px 11px;
}
.chips{display:flex; gap:4px}
.chip{
  flex:1 1 0; min-width:0; min-height:34px; padding:0 2px; border:1px solid var(--line);
  border-radius:8px; background:#fcfaf7; color:var(--dim); font-size:12px;
  font-family:inherit; white-space:nowrap;
}
.chip.on{color:#fff; border-color:transparent; font-weight:600}
.chip.c1.on{background:var(--blue)}
.chip.c2.on{background:var(--red)}
.chip.c3.on{background:var(--orange)}
.chip.c4.on{background:var(--teal)}
.chip.c0.on{background:var(--green)}
.chip.off{opacity:.45}
.empty{text-align:center; color:var(--dim); padding:36px 20px; font-size:14px}
.ghead{display:flex; justify-content:space-between; padding:9px 12px 5px; font-size:11.5px; color:var(--dim)}
.ghead b{color:var(--ink); font-size:12.5px}
footer{
  position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; gap:7px;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:rgba(247,244,239,.97); backdrop-filter:blur(10px); border-top:1px solid var(--line);
}
footer button{
  flex:1 1 0; min-height:42px; border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--ink); font-size:13.5px; font-family:inherit;
}
footer button.primary{background:var(--ink); border-color:var(--ink); color:#fff}
.sheet{position:fixed; inset:0; z-index:50; background:rgba(30,26,22,.45); display:flex; align-items:flex-end}
.sheet[hidden]{display:none}
.panel{
  background:var(--bg); width:100%; max-height:88vh; overflow:auto;
  border-radius:16px 16px 0 0; padding:15px 15px calc(18px + env(safe-area-inset-bottom));
}
.panel h2{margin:0 0 9px; font-size:15.5px}
.panel p{font-size:12.5px; color:#5c554d; margin:0 0 9px; line-height:1.65}
.panel ul{font-size:12.5px; color:#5c554d; padding-left:17px; margin:0 0 11px; line-height:1.7}
.panel li{margin-bottom:5px}
textarea{
  width:100%; height:92px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line); border-radius:9px; padding:8px; background:#fff;
  color:var(--ink); resize:vertical; word-break:break-all;
}
.panel .btns{display:flex; flex-wrap:wrap; gap:7px; margin:9px 0}
.panel .btns button{
  flex:1 1 45%; min-height:42px; border-radius:10px; border:1px solid var(--line);
  background:#fff; font-size:13.5px; font-family:inherit; color:var(--ink);
}
.panel .btns button.primary{background:var(--ink); border-color:var(--ink); color:#fff}
.panel .btns button.dangerbtn{color:#b3261e; font-weight:700; border-color:#e2c7c4}
.panel .danger button{
  width:100%; min-height:42px; border-radius:10px; border:1px solid #e2c7c4;
  background:#fdf6f5; color:#a4453f; font-size:13.5px; font-family:inherit;
}
.note{margin:0 10px 10px; padding:9px 11px; border-radius:9px; font-size:12px; background:#fdf6ea; color:#8a6d3b; border:1px solid #f0e2c8; line-height:1.6}
.note[hidden]{display:none}
.log{font:12px/1.7 ui-monospace,Menlo,monospace; background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px; max-height:38vh; overflow:auto; white-space:pre-wrap; color:#4a443d}
</style>
</head>

const TYPES=['短刀','胁差','打刀','太刀','大太刀','薙刀','枪','剑'];
const CN_NAME={'短刀':'短刀','胁差':'胁差','打刀':'打刀','太刀':'太刀','大太刀':'大太刀','薙刀':'薙刀','槍':'枪','枪':'枪','剑':'剑','剣':'剑'};
const KEY='tr_daocho_v2';
const KEXTRA='tr_daocho_extra_v2';
const KICON='tr_daocho_icon_v3';
const B_COLLECT=0, B_NAIFUKU=1, B_SHINKEN=2, B_CHUUSHOU=3, B_KEISOU=4, B_KIWA=5, B_CNOVR=6;

let S={};                 // 番号 -> 位掩码
let EXTRA=[];             // 通过「获取最新刀账」新增的刀
const pad3=n=>String(n).padStart(3,'0');
let ICON='067';           // 当前主屏图标（默认物吉贞宗 No.067）
let ICONFILES=null;       // 图标文件是否可用（null=未知，false=没有）
let ICON_PREFIX='icons/'; // 图标路径前缀：icons/ 或 根目录
let rows=[];              // 运行时列表
let storeOK=true;
let mode='cn';            // cn | cnalt | jp
let showKeiso=false;
let typeFilter='全部';
let gotFilter='全部', polFilter='全部', artFilter='全部';
let query='';

/* ---------- 存档 ---------- */
function warn(txt){ if(storeOK){storeOK=false; const el=document.getElementById('nostore'); el.hidden=false; el.innerHTML=txt;} }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function save(){
  const data=JSON.stringify(S);
  if(!lsSet(KEY,data)) warn('这个浏览器不允许本地保存（iPhone 用「文件」直接打开时常见）。你仍然可以勾选，但关掉页面会丢，请用底部「备份 / 恢复」把备份码或备份文件存到备忘录。');
}
function load(){
  if(!storageWorks()){
    warn('这个浏览器不允许本地保存（iPhone 用「文件」App 直接打开时常见）。勾选仍然有效，但关掉页面会丢——请用底部「备份 / 恢复」把备份码或备份文件存到备忘录。');
    return;
  }
  const raw=lsGet(KEY);
  if(raw){ try{ S=JSON.parse(raw)||{}; }catch(e){ S={}; } }
  const ic0=lsGet(KICON); if(ic0) ICON=pad3(ic0);
  const ex=lsGet(KEXTRA);
  if(ex){ try{ EXTRA=JSON.parse(ex)||[]; }catch(e){ EXTRA=[]; } }
}
function storageWorks(){
  try{ localStorage.setItem('__tr_probe','1'); localStorage.removeItem('__tr_probe'); return true; }catch(e){ return false; }
}
const bit=(k,b)=>(S[k]||0)>>b&1;
function setBit(k,b,on){ const v=(S[k]||0); S[k]= on? (v|(1<<b)) : (v&~(1<<b)); if(!S[k]) delete S[k]; save(); }
const noText=n=> n>=9998? '—' : String(n).padStart(3,'0');
const isCN=r=>r[4]===1||!!bit(r[2],B_CNOVR), canKiwaCN=r=>r[5]===1, hasKeiso=r=>r[6]===1, hasKeisoK=r=>r[7]===1;
function inMode(r){ return mode==='cn' ? isCN(r) : true; }
const unannounced=r=>r[4]===0;
function avatars(r){ return IMG[String(r[2])]||null; }
function avatarK(r){ return r[3]? (IMG[String(r[3])]||null) : null; }
function tileColor(t){ return {短刀:'#3d8a62',胁差:'#3a7ca5',打刀:'#b0453f',太刀:'#75529f',大太刀:'#bd7230',薙刀:'#2c8b86',枪:'#7a6a52',剑:'#4a6b8a'}[t]||'#8b8178'; }

/* ---------- 状态 ---------- */
function rowDoneK(r){
  const k=r[3]; if(!k) return true;
  if(!bit(r[2],B_KIWA)) return false;
  if(!bit(k,B_NAIFUKU)||!bit(k,B_SHINKEN)||!bit(k,B_CHUUSHOU)) return false;
  if(showKeiso&&hasKeisoK(r)&&!bit(k,B_KEISOU)) return false;
  return true;
}
function rowDone(r){
  if(!bit(r[2],B_COLLECT)) return false;
  if(!bit(r[2],B_NAIFUKU)||!bit(r[2],B_SHINKEN)||!bit(r[2],B_CHUUSHOU)) return false;
  if(showKeiso&&hasKeiso(r)&&!bit(r[2],B_KEISOU)) return false;
  return true;
}
function matchFilters(r){
  const a=r[2], k=r[3];
  if(gotFilter==='已获得'&&!bit(a,B_COLLECT)) return false;
  if(gotFilter==='未获得'&&bit(a,B_COLLECT)) return false;
  if(polFilter==='极化'&&!bit(a,B_KIWA)) return false;
  if(polFilter==='未极化'&&bit(a,B_KIWA)) return false;
  if(artFilter==='缺中伤'&&bit(a,B_CHUUSHOU)) return false;
  if(artFilter==='缺真剑必杀'&&bit(a,B_SHINKEN)) return false;
  if(artFilter==='缺内番服'&&bit(a,B_NAIFUKU)) return false;
  return true;
}
function canKiwa(r){ return mode==='jp' ? r[3]>0 : (r[3]>0&&r[5]===1); }
function visible(r){
  if(mode==='cn'&&!isCN(r)) return false;
  if(typeFilter!=='全部'&&r[1]!==typeFilter) return false;
  if(query&&!(r[0].indexOf(query)>=0||String(r[2]).indexOf(query)>=0)) return false;
  return matchFilters(r);
}

/* ---------- 渲染 ---------- */
function imgHTML(r,kiwa){
  const src = kiwa? (avatarK(r)||avatars(r)) : avatars(r);
  if(src) return '<img class="av" loading="lazy" alt="" src="'+src+'">';
  return '<div class="av ph" style="background:'+tileColor(r[1])+'">'+r[0].slice(kiwa?-1:0,kiwa?undefined:1)+'</div>';
}
function chipHTML(key,b,label,on,disabled){
  return '<button class="chip c'+b+(on?' on':'')+(disabled?' off':'')+'" data-k="'+key+'" data-b="'+b+'">'+label+'</button>';
}
/* 髭切 / 膝丸 这类一振占多个刀帐位的刀：额外刀帐位单独成行，只记中伤 / 真剑必杀 */
function slotRowsHTML(r){
  const slots=r[8]||[];
  let h='';
  for(const s of slots){
    const num=s[0], label=s[1];
    const done=!!bit(num,B_CHUUSHOU)&&!!bit(num,B_SHINKEN);
    h+='<div class="row sub'+(done?' done':'')+'" data-row="'+num+'">'+
      imgHTML(r,false)+
      '<div class="mid"><div class="l1">'+
        '<span class="no">No.'+noText(num)+'</span>'+
        '<span class="nm">'+r[0]+' · '+label+'</span>'+
        '<span class="tag">'+r[1]+'</span>'+
      '</div><div class="chips">'+
        chipHTML(num,B_CHUUSHOU,'中伤',!!bit(num,B_CHUUSHOU))+
        chipHTML(num,B_SHINKEN,'真剑必杀',!!bit(num,B_SHINKEN))+
        chipHTML(num,B_NAIFUKU,'内番服',!!bit(num,B_NAIFUKU))+
      '</div></div></div>';
  }
  return h;
}
/* 极化行：极化在刀帐里是单独一个号，也带刀种标签方便筛选 */
function kiwaRowHTML(r,withButtons){
  const a=r[2], k=r[3];
  const canK=canKiwa(r), got=!!bit(a,B_COLLECT);
  return '<div class="row krow'+(rowDoneK(r)?' done':'')+'" data-row="'+k+'">'+
    imgHTML(r,true)+
    '<div class="mid"><div class="l1">'+
      '<span class="no">No.'+noText(k)+'</span>'+
      '<span class="nm">'+r[0]+' · 极</span>'+
      '<span class="tag">'+r[1]+'</span>'+
      (canK?'':'<span class="tag" style="color:#a4453f;border-color:#e2c7c4">国服未开放</span>')+
      (withButtons? '<span class="lbtn"><button class="st pol on" data-kiwa="'+a+'">已极化</button>'+
        '<button class="st got'+(got?' on':'')+'" data-collect="'+a+'">'+(got?'已获得':'未获得')+'</button></span>' : '')+
    '</div><div class="chips">'+
      chipHTML(k,B_CHUUSHOU,'中伤',!!bit(k,B_CHUUSHOU))+
      chipHTML(k,B_SHINKEN,'真剑必杀',!!bit(k,B_SHINKEN))+
      chipHTML(k,B_NAIFUKU,'内番服',!!bit(k,B_NAIFUKU))+
      (showKeiso? chipHTML(k,B_KEISOU,'轻装',!!bit(k,B_KEISOU),!hasKeisoK(r)) : '')+
    '</div></div></div>';
}
function rowHTML(r){
  const a=r[2], k=r[3];
  const polarized=!!bit(a,B_KIWA), got=!!bit(a,B_COLLECT);
  if(polFilter==='极化') return (k&&polarized)? kiwaRowHTML(r,true) : '';
  const cnBadge = (mode!=='jp'&&unannounced(r))
    ? '<button class="tag cnbadge" data-cnovr="'+a+'">'+(bit(a,B_CNOVR)?'已上线·手动':'官网未见公告')+'</button>' : '';
  let h='<div class="row'+(rowDone(r)?' done':'')+(isCN(r)?'':' miss')+'" data-row="'+a+'">'+
    imgHTML(r,false)+
    '<div class="mid"><div class="l1">'+
      '<span class="no">No.'+noText(a)+'</span>'+
      '<span class="nm">'+r[0]+'</span>'+
      '<span class="tag">'+r[1]+'</span>'+
      cnBadge+
      '<span class="lbtn">'+
        (k? '<button class="st pol'+(polarized?' on':'')+'" data-kiwa="'+a+'">'+(polarized?'已极化':'未极化')+'</button>' : '')+
        '<button class="st got'+(got?' on':'')+'" data-collect="'+a+'">'+(got?'已获得':'未获得')+'</button>'+
      '</span>'+
    '</div><div class="chips">'+
      chipHTML(a,B_CHUUSHOU,'中伤',!!bit(a,B_CHUUSHOU))+
      chipHTML(a,B_SHINKEN,'真剑必杀',!!bit(a,B_SHINKEN))+
      chipHTML(a,B_NAIFUKU,'内番服',!!bit(a,B_NAIFUKU))+
      (showKeiso? chipHTML(a,B_KEISOU,'轻装',!!bit(a,B_KEISOU),!hasKeiso(r)) : '')+
    '</div></div></div>';
  h+=slotRowsHTML(r);
  if(k && polarized) h+=kiwaRowHTML(r,false);
  return h;
}
function listHTML(){
  const group=rows.filter(visible).sort((x,y)=>x[2]-y[2]);
  if(!group.length) return '<div class="empty">没有符合条件的刀剑</div>';
  return group.map(rowHTML).join('');
}
function render(){ document.getElementById('list').innerHTML=listHTML(); renderStats(); }
function pool(){
  const base=rows.filter(r=>inMode(r));
  const out={all:base, kiwaOpen:base.filter(canKiwa)};
  return out;
}
function renderStats(){
  const {all,kiwaOpen}=pool();
  const c=(b,list)=>list.reduce((n,r)=>n+bit(r[2],b),0);
  const ck=(b,list)=>list.reduce((n,r)=>n+bit(r[3],b),0);
  const polar=all.filter(r=>bit(r[2],B_KIWA));
  const N=all.length;
  const kk=kiwaOpen.length, np=polar.length;
  const un=rows.filter(unannounced).length;
  document.getElementById('scope').innerHTML=
      mode==='cn'? '国服 · 官方公告已实装 '+N+' 振'
    : mode==='cnalt'? '国服（含日服刀剑）· '+N+' 振'
    : '日服 · '+N+' 振';
  if(mode!=='jp'&&un) document.getElementById('scope').innerHTML+=' · 官网未见公告 '+un+' 振';
  document.getElementById('stats').innerHTML=
    '<span>已获得 <b>'+c(B_COLLECT,all)+'/'+N+'</b></span>'+
    '<span>中伤 <b>'+c(B_CHUUSHOU,all)+'/'+N+'</b></span>'+
    '<span>真剑必杀 <b>'+c(B_SHINKEN,all)+'/'+N+'</b></span>'+
    '<span>内番服 <b>'+c(B_NAIFUKU,all)+'/'+N+'</b></span>'+
    '<span>已极化 <b>'+polar.length+'/'+kk+'</b></span>'+
    '<span>极中伤 <b>'+ck(B_CHUUSHOU,polar)+'/'+(np||0)+'</b></span>'+
    '<span>极真剑 <b>'+ck(B_SHINKEN,polar)+'/'+(np||0)+'</b></span>'+
    '<span>极内番 <b>'+ck(B_NAIFUKU,polar)+'/'+(np||0)+'</b></span>';
  const pct=(n,d)=>d?Math.round(n/d*100):0;
  document.getElementById('bar').innerHTML=
    '<i style="background:#3d8a62;width:'+pct(c(B_COLLECT,all),N)+'%"></i>'+
    '<i style="background:#bd7230;width:'+pct(c(B_CHUUSHOU,all),N)+'%"></i>'+
    '<i style="background:#b0453f;width:'+pct(c(B_SHINKEN,all),N)+'%"></i>'+
    '<i style="background:#3a7ca5;width:'+pct(c(B_NAIFUKU,all),N)+'%"></i>';
}
function renderFilters(){
  document.getElementById('serverRow').innerHTML=
    '<button class="pill seg'+(mode==='cn'?' on':'')+'" data-mode="cn">国服</button>'+
    '<button class="pill seg'+(mode==='cnalt'?' on':'')+'" data-mode="cnalt">国服（显示日服刀剑）</button>'+
    '<button class="pill seg'+(mode==='jp'?' on':'')+'" data-mode="jp">日服</button>'+
    '<button class="pill'+(showKeiso?' on':'')+'" data-tog="keiso">显示轻装</button>'+
    '<button class="pill" data-manual="1">＋ 手动录入</button>';
  const types=['全部'].concat(TYPES.filter(t=>rows.some(r=>r[1]===t&&inMode(r))));
  document.getElementById('typeRow').innerHTML=types.map(t=>
    '<button class="pill'+(typeFilter===t?' on':'')+'" data-type="'+t+'">'+t+'</button>').join('');
  const mk=(arr,attr,cur)=>arr.map(t=>
    '<button class="pill'+(cur===t?' on':'')+'" data-'+attr+'="'+t+'">'+t+'</button>').join('');
  document.getElementById('gotRow').innerHTML=mk(['全部','已获得','未获得'],'got',gotFilter);
  document.getElementById('polRow').innerHTML=mk(['全部','极化','未极化'],'pol',polFilter);
  document.getElementById('artRow').innerHTML=mk(['全部','缺中伤','缺真剑必杀','缺内番服'],'art',artFilter);
}

/* ---------- 交互 ---------- */
document.getElementById('list').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){
    const k=chip.dataset.k, b=+chip.dataset.b;
    setBit(k,b,!bit(k,b)); render(); return;
  }
  const cb=e.target.closest('[data-cnovr]');
  if(cb){ const a=cb.dataset.cnovr; setBit(a,B_CNOVR,!bit(a,B_CNOVR)); renderFilters(); render(); return; }
  const gb=e.target.closest('[data-collect]');
  if(gb){ const a=gb.dataset.collect; setBit(a,B_COLLECT,!bit(a,B_COLLECT)); render(); return; }
  const kb=e.target.closest('[data-kiwa]');
  if(kb){ const a=kb.dataset.kiwa; setBit(a,B_KIWA,!bit(a,B_KIWA)); render(); }
});
document.getElementById('serverRow').addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]');
  if(m){ mode=m.dataset.mode; renderFilters(); render(); return; }
  if(e.target.closest('[data-manual]')){ openManual(); return; }
  const t=e.target.closest('[data-tog]');
  if(t){
    if(t.dataset.tog==='keiso') showKeiso=!showKeiso;
    renderFilters(); render();
  }
});
document.getElementById('typeRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-type]'); if(!b) return;
  typeFilter=b.dataset.type; renderFilters(); render();
});
document.getElementById('gotRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-got]'); if(!b) return;
  gotFilter=b.dataset.got; renderFilters(); render();
});
document.getElementById('polRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-pol]'); if(!b) return;
  polFilter=b.dataset.pol; renderFilters(); render();
});
document.getElementById('artRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-art]'); if(!b) return;
  artFilter=b.dataset.art; renderFilters(); render();
});
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim(); render(); });

function applyIcon(){
  const file=ICON_PREFIX+ICON+'.jpg';
  const emb=IMG[ICON]||'';
  const href=(ICONFILES===false&&emb)? emb : file;   // 没有 icons 文件夹时退回内嵌头像（尽力而为）
  const ai=document.getElementById('appleIcon'); if(ai) ai.setAttribute('href',href);
  const fi=document.getElementById('favIcon'); if(fi) fi.setAttribute('href',href);
  const im=document.getElementById('iconImg'); if(im) im.src=(ICON===ICON_DEFAULT&&emb)? emb : (emb||file);
}
function probeIcons(){
  const p=new Image();
  p.onload=()=>{ ICONFILES=true; ICON_PREFIX='icons/'; applyIcon(); };
  p.onerror=()=>{ const q=new Image();
    q.onload=()=>{ ICONFILES=true; ICON_PREFIX=''; applyIcon(); };
    q.onerror=()=>{ ICONFILES=false; applyIcon(); };
    q.src=ICON_DEFAULT+'.jpg'; };
  p.src='icons/'+ICON_DEFAULT+'.jpg';
}

/* ---------- .xlsx 读写（自带实现，不依赖外部库/网络） ---------- */
const XCOLS=['刀账序号','刀种','刀剑名','阶段','已获得','中伤','真剑必杀','内番服','轻装','已极化','极中伤','极真剑','极内番','国服状态'];
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const str2u8=s=>new TextEncoder().encode(s);
const u8str=b=>new TextDecoder().decode(b);
async function deflateRaw(b){ if(typeof CompressionStream==='undefined') return null;
  return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); }
async function inflateRaw(b){ if(typeof DecompressionStream==='undefined') throw new Error('这个浏览器不支持解压，请用新版 Chrome / Safari');
  return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
async function zipFiles(files){
  const parts=[],central=[];let off=0;
  for(const f of files){
    const nb=str2u8(f.name),crc=crc32(f.data);
    let comp=await deflateRaw(f.data),method=8;
    if(!comp){comp=f.data;method=0;}
    const lh=new Uint8Array(30+nb.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(8,method,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,comp.length,true);dv.setUint32(22,f.data.length,true);
    dv.setUint16(26,nb.length,true);
    lh.set(nb,30);
    parts.push(lh,comp);
    central.push({nb,crc,cs:comp.length,sz:f.data.length,off,method});
    off+=lh.length+comp.length;
  }
  const cds=[];let cdsize=0;
  for(const c of central){
    const ch=new Uint8Array(46+c.nb.length),dv=new DataView(ch.buffer);
    dv.setUint32(0,0x02014b50,true);dv.setUint16(4,20,true);dv.setUint16(6,20,true);dv.setUint16(10,c.method,true);
    dv.setUint32(16,c.crc,true);dv.setUint32(20,c.cs,true);dv.setUint32(24,c.sz,true);
    dv.setUint16(28,c.nb.length,true);dv.setUint32(42,c.off,true);
    ch.set(c.nb,46);
    cds.push(ch);cdsize+=ch.length;
  }
  const e=new Uint8Array(22),dv=new DataView(e.buffer);
  dv.setUint32(0,0x06054b50,true);dv.setUint16(8,central.length,true);dv.setUint16(10,central.length,true);
  dv.setUint32(12,cdsize,true);dv.setUint32(16,off,true);
  return new Blob([...parts,...cds,e],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function unzip(buffer){
  const u8=new Uint8Array(buffer),dv=new DataView(buffer);
  let e=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-70000;i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error('不是有效的 xlsx 文件');
  const count=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const out={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),
          nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),
          lo=dv.getUint32(p+42,true);
    const name=u8str(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true);
    const raw=u8.subarray(lo+30+lnl+lel,lo+30+lnl+lel+cs);
    out[name]= method===0? raw.slice() : await inflateRaw(raw);
    p+=46+nl+el+cl;
  }
  return out;
}
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26;}return s;};
const colIndex=ref=>{const m=/^([A-Z]+)/.exec(ref||'');if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+(ch.charCodeAt(0)-64);return n-1;};
const escXml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function buildSheetXML(gridRows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  gridRows.forEach((row,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    row.forEach((v,ci)=>{
      if(v===''||v==null) return;
      x+='<c r="'+colName(ci)+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+escXml(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function parseSheetXML(xml,shared){
  const doc=new DOMParser().parseFromString(xml,'application/xml'),grid=[];
  doc.querySelectorAll('row').forEach(r=>{
    const cells=[];
    r.querySelectorAll('c').forEach(c=>{
      const ci=colIndex(c.getAttribute('r')),t=c.getAttribute('t');
      let val='';
      if(t==='s'){ const v=c.querySelector('v'); val=shared[+(v?v.textContent:0)]||''; }
      else if(t==='inlineStr'){ const is=c.querySelector('is'); val=is?is.textContent:''; }
      else { const v=c.querySelector('v'); val=v?v.textContent:''; }
      cells[ci]=val;
    });
    grid.push(cells);
  });
  return grid;
}
function sharedStrings(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml'),out=[];
  doc.querySelectorAll('si').forEach(si=>out.push(si.textContent||''));
  return out;
}
function xlsxRows(){
  const out=[XCOLS.slice()],mark=v=>v?'√':'';
  const list=rows.filter(inMode).sort((a,b)=>a[2]-b[2]);
  for(const r of list){
    const a=r[2],k=r[3],st=r[4]?'已实装':'官网未见公告';
    out.push([noText(a),r[1],r[0],'通常',mark(bit(a,B_COLLECT)),mark(bit(a,B_CHUUSHOU)),mark(bit(a,B_SHINKEN)),
              mark(bit(a,B_NAIFUKU)),mark(bit(a,B_KEISOU)),mark(bit(a,B_KIWA)),'','','',st]);
    for(const s of (r[8]||[]))
      out.push([noText(s[0]),r[1],r[0],s[1],'',mark(bit(s[0],B_CHUUSHOU)),mark(bit(s[0],B_SHINKEN)),mark(bit(s[0],B_NAIFUKU)),'','','','','',st]);
    if(k) out.push([noText(k),r[1],r[0],'极','','','','','','',mark(bit(k,B_CHUUSHOU)),mark(bit(k,B_SHINKEN)),mark(bit(k,B_NAIFUKU)),st]);
  }
  return out;
}
function importXlsx(grid){
  const head=(grid[0]||[]).map(v=>String(v||'').trim());
  const I=n=>head.indexOf(n);
  const iNo=I('刀账序号'),iStage=I('阶段');
  if(iNo<0) throw new Error('表头不对：缺少「刀账序号」列');
  const iGot=I('已获得'),iChu=I('中伤'),iShin=I('真剑必杀'),iNai=I('内番服'),iKei=I('轻装'),iPol=I('已极化'),
        iKChu=I('极中伤'),iKShin=I('极真剑'),iKNai=I('极内番');
  const on=v=>!!String(v==null?'':v).trim();
  const byNum={},byK={};
  for(const r of rows){ byNum[r[2]]=r; if(r[3]) byK[r[3]]=r; }
  let n=0;
  for(const row of grid.slice(1)){
    const num=parseInt(String(row[iNo]||'').replace(/\D/g,''),10);
    if(!num) continue;
    const isK=(iStage>=0 && String(row[iStage]||'').trim()==='极');
    if(isK){
      if(!byK[num]) continue;
      if(iKChu>=0) setBit(num,B_CHUUSHOU,on(row[iKChu]));
      if(iKShin>=0) setBit(num,B_SHINKEN,on(row[iKShin]));
      if(iKNai>=0) setBit(num,B_NAIFUKU,on(row[iKNai]));
      if(iKei>=0) setBit(num,B_KEISOU,on(row[iKei]));
      n++; continue;
    }
    const key=num;
    if(iGot>=0) setBit(key,B_COLLECT,on(row[iGot]));
    if(iChu>=0) setBit(key,B_CHUUSHOU,on(row[iChu]));
    if(iShin>=0) setBit(key,B_SHINKEN,on(row[iShin]));
    if(iNai>=0) setBit(key,B_NAIFUKU,on(row[iNai]));
    if(iKei>=0) setBit(key,B_KEISOU,on(row[iKei]));
    if(iPol>=0) setBit(key,B_KIWA,on(row[iPol]));
    n++;
  }
  save();
  return n;
}
async function xlsxBlob(){
  const files=[
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="刀账立绘" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml',buildSheetXML(xlsxRows())]
  ].map(f=>({name:f[0],data:str2u8(f[1])}));
  return await zipFiles(files);
}
async function exportXlsx(){
  const blob=await xlsxBlob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='刀账立绘.xlsx'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

document.getElementById('btnBackup').addEventListener('click',()=>{
  openPanel('<h2>备份 / 恢复</h2>'+
  '<p>把备份码存进备忘录或微信收藏。换手机、清缓存、换新版本之后，粘回来点「导入并覆盖」就能恢复全部勾选。</p>'+
  '<textarea id="code" spellcheck="false"></textarea>'+
  '<div class="btns">'+
    '<button class="primary" data-act="copy">复制备份码</button>'+
    '<button class="dangerbtn" data-act="import">导入并覆盖</button>'+
  '</div>'+
  '<p style="font-size:12px;color:#8b8178;margin:0 0 12px">点空白处即可关闭本窗口</p>'+
  '<div class="danger"><button data-act="reset">清空全部记录</button></div>');
  document.getElementById('code').value=encodeState();
});

function encodeState(){
  return 'TRB2:'+JSON.stringify({v:2,s:S,e:EXTRA.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]])});
}
function decodeState(txt){
  try{
    let t=(txt||'').trim();
    if(t.indexOf('TRB2:')!==0) return null;
    const o=JSON.parse(t.slice(5));
    return o;
  }catch(e){ return null; }
}
panel.addEventListener('click',async e=>{
  const ic=e.target.closest('[data-icon]');
  if(ic){
    ICON=ic.dataset.icon; lsSet(KICON,ICON); applyIcon();
    panel.querySelectorAll('.ic').forEach(x=>x.classList.toggle('on',x===ic));
    const hh=document.getElementById('iconHint');
    if(hh) hh.textContent='当前图标：'+((ic.querySelector('span')||{textContent:ICON}).textContent);
    return;
  }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='close') return closePanel();
  if(act==='madd'){
    const num=parseInt(document.getElementById('mNo').value,10);
    const nm=(document.getElementById('mName').value||'').trim();
    const tp=document.getElementById('mType').value;
    const kk=parseInt(document.getElementById('mK').value,10);
    if(!num||!nm) return alert('刀帐编号和刀名都要填。');
    if(rows.some(r=>r[2]===num||r[3]===num)) return alert('编号 '+num+' 已经存在了。');
    EXTRA.push([nm,tp,num,isNaN(kk)?0:kk,1,1,0,0]);
    lsSet(KEXTRA,JSON.stringify(EXTRA));
    rebuild(); renderFilters(); render(); openManual();
    return;
  }
  if(act==='mdel'){
    const i=+b.dataset.i; EXTRA.splice(i,1);
    lsSet(KEXTRA,JSON.stringify(EXTRA));
    rebuild(); renderFilters(); render(); openManual();
    return;
  }
  if(act==='copy'){
    const t=document.getElementById('code'); t.select(); t.setSelectionRange(0,t.value.length);
    try{ await navigator.clipboard.writeText(t.value); }catch(err){ document.execCommand('copy'); }
    b.textContent='已复制'; setTimeout(()=>b.textContent='复制备份码',1200); return;
  }
  if(act==='import'){
    const o=decodeState(document.getElementById('code').value);
    if(!o) return alert('备份码看不懂，检查是否粘贴完整。');
    S=o.s||{}; if(o.e&&o.e.length) EXTRA=o.e;
    save(); lsSet(KEXTRA,JSON.stringify(EXTRA));
    rebuild(); closePanel(); renderFilters(); render(); return;
  }
  if(act==='xlsxout'){
    b.textContent='正在导出…';
    try{ await exportXlsx(); b.textContent='导出 .xlsx 文件'; }
    catch(err){ b.textContent='导出 .xlsx 文件'; alert('导出失败：'+err.message); }
    return;
  }
  if(act==='xlsxin'){
    const f=document.getElementById('fileIn');
    f.onchange=async()=>{
      try{
        const buf=await f.files[0].arrayBuffer();
        const files=await unzip(buf);
        const names=Object.keys(files);
        const sheet=names.find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))||names.find(n=>/worksheets\/.+\.xml$/.test(n));
        if(!sheet) throw new Error('文件里没有找到工作表');
        const shared=files['xl/sharedStrings.xml']? sharedStrings(files['xl/sharedStrings.xml']) : [];
        const n=importXlsx(parseSheetXML(u8str(files[sheet]),shared));
        closePanel(); renderFilters(); render();
        alert('已导入 '+n+' 行，勾选已按文件内容覆盖。');
      }catch(err){ alert('导入失败：'+err.message); }
    };
    f.click(); return;
  }
  if(act==='reset'){
    if(confirm('确定清空所有勾选记录吗？此操作不可撤销。')){
      S={}; EXTRA=[]; save(); lsSet(KEXTRA,'[]'); rebuild(); closePanel(); renderFilters(); render();
    }
  }
});

/* ---------- 获取最新刀账（日文维基，接口允许网页直连） ---------- */
document.getElementById('btnUpdate').addEventListener('click',async()=>{
  openPanel('<h2>获取最新刀账</h2><p>正在从日文维基百科读取最新刀剑名录…</p><div class="log" id="log">连接中…</div>'+
    '<div class="btns"><button data-act="close">关闭</button></div>');
  const log=t=>{ const el=document.getElementById('log'); if(el) el.textContent+= '\n'+t; };
  try{
    const url='https://ja.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&prop=text&redirects=1&origin=*&page='+encodeURIComponent('刀剣乱舞-ONLINE-');
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(!j.parse||!j.parse.text) throw new Error('返回内容异常');
    log('已读取页面（'+(j.parse.text.length/1024|0)+' KB），解析中…');
    const doc=new DOMParser().parseFromString(j.parse.text,'text/html');
    const cleanText=el=>{ const c=el.cloneNode(true);
      c.querySelectorAll('.mw-editsection,sup,style').forEach(x=>x.remove());
      return (c.textContent||'').replace(/\s+/g,'').trim(); };
    const KIND_KEYS=Object.keys(CN_NAME);
    const found=[];
    let kind=null;
    doc.querySelectorAll('h2,h3,h4,h5,table').forEach(el=>{
      if(el.tagName!=='TABLE'){
        const t=cleanText(el);
        if(el.tagName==='H2'){ kind=null; return; }
        const hit=KIND_KEYS.find(k=>t===k||t.indexOf(k)===0);
        if(hit && t.length<=6) kind=CN_NAME[hit];
        return;
      }
      if(!kind) return;
      el.querySelectorAll('tr').forEach(tr=>{
        const td=tr.querySelectorAll('td');
        if(td.length<5) return;
        const raw=(td[0].textContent||'').replace(/\s|\u00a0/g,'');
        if(!/^\d{1,3}$/.test(raw)) return;
        const num=parseInt(raw,10);
        const nm=(td[1].textContent||'').replace(/\[\d+\]/g,'').replace(/\s+/g,' ').trim();
        if(!nm) return;
        found.push([nm,kind,num]);
      });
    });
    log('日文维基读到 '+found.length+' 振。');
    const known=new Set(rows.map(r=>r[2]).concat(rows.map(r=>r[3]).filter(x=>x)));
    const news=found.filter(f=>!known.has(f[2]));
    if(!news.length){ log('没有发现新刀，刀账是最新的。'); return; }
    log('新增 '+news.length+' 振：');
    news.forEach(f=>log('  No.'+String(f[2]).padStart(3,'0')+' '+f[0]+'（'+f[1]+'）'));
    news.forEach(f=>{
      if(!EXTRA.some(r=>r[2]===f[2])) EXTRA.push([f[0],f[1],f[2],0,0,0,0,0]);
    });
    lsSet(KEXTRA,JSON.stringify(EXTRA));
    rebuild();
    log('已加入列表（标记为国服未上线）。已有记录未受影响。');
    renderFilters(); render();
  }catch(err){
    log('失败：'+err.message);
    log('可能是网络无法访问日文维基（国内常需要代理），或浏览器拦截了跨站请求。');
    log('可以稍后重试，或让我（Codex）帮你生成一版新的数据。');
  }
});

/* ---------- 启动 ---------- */
function rebuild(){
  rows=DATA.concat(EXTRA.filter(e=>!DATA.some(d=>d[2]===e[2])));
  rows.sort((a,b)=>a[2]-b[2]);
}
load(); rebuild(); renderFilters(); render();
document.getElementById('iconBtn').addEventListener('click',openIconPicker);
applyIcon();
probeIcons();
</script>
